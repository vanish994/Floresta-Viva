<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10140f" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Floresta Viva — mundo procedural</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">carregando a floresta…</div>
    <script>
      // Proteção independente do módulo do jogo: se um import falhar antes de
      // src/main.ts iniciar, a tela de loading não pode ficar por cima para sempre.
      (function () {
        var timer = setTimeout(function () {
          var loading = document.getElementById('loading');
          if (loading && loading.style.display !== 'none') {
            loading.style.display = 'none';
            var box = document.getElementById('startup-error');
            if (!box) {
              box = document.createElement('div');
              box.id = 'startup-error';
              box.style.cssText = 'position:fixed;z-index:99999;left:8px;right:8px;top:8px;padding:12px;background:#401d18;color:#fff;border:1px solid #e08b70;border-radius:8px;font:14px system-ui;white-space:pre-wrap';
              box.textContent = 'O jogo não conseguiu iniciar. Atualize a página; se persistir, envie uma captura desta mensagem.';
              document.body.appendChild(box);
            }
          }
        }, 20000);
        window.addEventListener('error', function (e) {
          var box = document.getElementById('startup-error');
          if (!box) {
            box = document.createElement('div');
            box.id = 'startup-error';
            box.style.cssText = 'position:fixed;z-index:99999;left:8px;right:8px;top:8px;padding:12px;background:#401d18;color:#fff;border:1px solid #e08b70;border-radius:8px;font:14px system-ui;white-space:pre-wrap';
            document.body.appendChild(box);
          }
          box.textContent = 'Erro ao iniciar: ' + (e.message || 'falha de script') + (e.filename ? '\\n' + e.filename + ':' + e.lineno : '');
          clearTimeout(timer);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var box = document.getElementById('startup-error');
          if (!box) {
            box = document.createElement('div');
            box.id = 'startup-error';
            box.style.cssText = 'position:fixed;z-index:99999;left:8px;right:8px;top:8px;padding:12px;background:#401d18;color:#fff;border:1px solid #e08b70;border-radius:8px;font:14px system-ui;white-space:pre-wrap';
            document.body.appendChild(box);
          }
          box.textContent = 'Erro ao iniciar: ' + String(e.reason || e);
          clearTimeout(timer);
        });
      })();
    </script>
    <div id="hud">
      <div class="hud-row">
        <span id="hud-time">--:--</span>
        <span id="hud-season"></span>
        <span id="hud-temp"></span>
      </div>
      <div class="hud-row">
        <span id="hud-seed"></span>
        <span id="hud-save"></span>
      </div>
      <div class="hud-row small"><span id="hud-swim"></span></div>
      <div class="hud-row small"><span id="hud-eco"></span></div>
      <div class="hud-row small"><span id="hud-perf"></span></div>
      <div class="hud-row small"><span id="hud-debug"></span></div>
      <div class="hud-row controls">
        <button id="btn-hud" title="recolher/expandir">–</button>
        <input id="seed-input" placeholder="seed (nº ou texto)" />
        <button id="btn-new">novo mundo</button>
        <button id="btn-save">salvar</button>
        <button id="btn-debug">debug</button>
        <button id="btn-pause">pausa</button>
        <button id="btn-char">personagem</button>
      </div>
      <div class="hud-row small help">
        WASD/setas ou joystick mover · água funda: nada · Q debug (inclui eco) · P pausa · F derrubar · G plantar
      </div>
    </div>
    <button id="btn-rain" aria-pressed="false">🌧 chuva</button>
    <button id="btn-tileset" aria-pressed="false" title="Alternar Pack/Harmonious">🗺 tileset: Pack</button>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
