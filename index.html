<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10140f" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Floresta Viva — mundo procedural</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">carregando a floresta…</div>
    <div id="hud">
      <div class="hud-row">
        <span id="hud-time">--:--</span>
        <span id="hud-season"></span>
        <span id="hud-temp"></span>
      </div>
      <div class="hud-row">
        <span id="hud-seed"></span>
        <span id="hud-save"></span>
      </div>
      <div class="hud-row small"><span id="hud-perf"></span></div>
      <div class="hud-row small"><span id="hud-debug"></span></div>
      <div class="hud-row controls">
        <button id="btn-hud" title="recolher/expandir">–</button>
        <input id="seed-input" placeholder="seed (nº ou texto)" />
        <button id="btn-new">novo mundo</button>
        <button id="btn-save">salvar</button>
        <button id="btn-debug">debug</button>
        <button id="btn-pause">pausa</button>
        <button id="btn-rain" aria-pressed="false">🌧 chuva</button>
        <button id="btn-char">personagem</button>
      </div>
      <div class="hud-row small help">
        WASD/setas ou joystick mover · Q debug · P pausa · F derrubar · G plantar
      </div>
    </div>
    <script>
      (() => {
        const rainGlobal = globalThis;
        rainGlobal.__florestaRainOverride = false;
        const button = document.getElementById('btn-rain');
        button?.addEventListener('click', () => {
          const enabled = rainGlobal.__florestaRainOverride !== true;
          rainGlobal.__florestaRainOverride = enabled;
          if (button) {
            button.textContent = enabled ? '☀ parar chuva' : '🌧 chuva';
            button.setAttribute('aria-pressed', String(enabled));
          }
        });
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
